name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Patch hosted action runtime
        if: runner.environment == 'github-hosted' && runner.os == 'Linux'
        uses: zkp2p/.github/actions/patch-node24@96cd20d1545013b0e7e89b56ce80ab2c4a42df9d

      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run ci
